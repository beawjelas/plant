<title>Menu</title>
<style>
    :root {
        color-scheme: light dark;
        --bg: #f4f7fa; --text: #0f1b24; --sub: #5b6b78;
        --brand: #008200; --btn-from: #0a9a2a; --btn-to: #006b17; --btn-text: #ffffff;
        --btn-shadow: 0 8px 20px rgba(0, 130, 0, .30), inset 0 1px 0 rgba(255,255,255,.25);
        --glow: rgba(0, 130, 0, .12);
        --logo-filter: none;
    }
    @media (prefers-color-scheme: dark) {
        :root {
            --bg: #0e1113; --text: #f1f5f8; --sub: #9aa8b3;
            --brand: #3ddc5a; --btn-from: #0e8a2c; --btn-to: #064d14; --btn-text: #ffffff;
            --btn-shadow: 0 8px 22px rgba(0, 0, 0, .55), 0 0 0 1px rgba(61,220,90,.25), 0 0 22px rgba(61,220,90,.12), inset 0 1px 0 rgba(255,255,255,.12);
            --glow: rgba(61, 220, 90, .12);
            --logo-filter: brightness(1.55) saturate(1.1);
        }
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body { height: 100%; margin: 0; }
    body {
        background: radial-gradient(ellipse 80% 40% at 50% 0%, var(--glow), transparent 70%) no-repeat, var(--bg); color: var(--text);
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
        display: flex; flex-direction: column; align-items: center;
        height: 100vh; height: 100dvh; overflow: hidden;
        padding: calc(28px + env(safe-area-inset-top, 0px)) 20px calc(64px + env(safe-area-inset-bottom, 0px));
    }
    header { text-align: center; flex: none; }
    header img { height: 96px; width: auto; max-width: 100%; filter: var(--logo-filter); }
    .company { margin: 14px 0 2px; font-size: 18px; font-weight: 700; letter-spacing: .5px; }
    .dept { margin: 0; font-size: 14px; font-weight: 600; color: var(--sub); letter-spacing: 2px; }
    main { width: 100%; max-width: 520px; text-align: center; margin-top: 0; flex: 1; min-height: 0; display: flex; flex-direction: column; }
    h1 { margin: 0; font-size: clamp(30px, 8vw, 56px); font-weight: 600; letter-spacing: -.5px; line-height: 1.1; }
    .divider {
        position: relative; overflow: hidden; height: 2px; margin: 14px 0 20px; flex: none; border-radius: 2px;
        background: linear-gradient(90deg, transparent, var(--brand) 20%, var(--brand) 80%, transparent);
        box-shadow: 0 0 10px var(--glow);
        transform-origin: center; animation: drawIn .9s ease-out both;
    }
    .divider .spark {
        position: absolute; top: 0; bottom: 0; left: -40%; width: 30%; opacity: 0; pointer-events: none;
        background: linear-gradient(90deg, transparent, #ffffff, transparent);
    }
    @keyframes drawIn { from { transform: scaleX(0); opacity: 0; } to { transform: scaleX(1); opacity: 1; } }
    @media (prefers-reduced-motion: reduce) { .divider { animation: none; } }
    .menu {
        display: flex; flex-direction: column; gap: 16px;
        flex: 1; min-height: 0; overflow-y: auto; overflow-x: hidden;
        overscroll-behavior: contain; -webkit-overflow-scrolling: touch;
        /* ruang agar bayangan & efek hover tidak terpotong */
        padding: 6px 4px 18px; margin: -6px -4px 0;
        scrollbar-width: thin; scrollbar-color: var(--brand) transparent;
    }
    .menu::-webkit-scrollbar { width: 6px; }
    .menu::-webkit-scrollbar-thumb { background: var(--brand); border-radius: 3px; }
    .menu::-webkit-scrollbar-track { background: transparent; }
    .menu a { flex: none; }
    .menu a {
        position: relative; overflow: hidden;
        display: flex; align-items: center; gap: 16px; padding: 14px 18px 14px 14px;
        background: linear-gradient(135deg, var(--btn-from), var(--btn-to));
        color: var(--btn-text);
        border: 1px solid rgba(255, 255, 255, .16);
        border-radius: 18px; box-shadow: var(--btn-shadow);
        font-size: 18px; font-weight: 700; letter-spacing: 2px; text-align: left;
        text-decoration: none; text-transform: uppercase;
        transition: transform .18s ease, box-shadow .18s ease, filter .18s ease;
    }
    .menu a::before {
        content: ""; position: absolute; top: 0; bottom: 0; left: -60%; width: 40%;
        background: linear-gradient(100deg, transparent, rgba(255,255,255,.28), transparent);
        transform: skewX(-20deg); transition: left .6s ease; pointer-events: none;
    }
    .menu a:hover::before { left: 130%; }
    .menu a span { flex: 1; }
    .menu a svg { flex: none; }
    .menu a .ico {
        width: 46px; height: 46px; padding: 11px; border-radius: 14px;
        background: rgba(255, 255, 255, .18); border: 1px solid rgba(255, 255, 255, .22);
    }
    .menu a .go { width: 22px; height: 22px; opacity: .8; transition: transform .18s ease, opacity .18s ease; }
    .menu a:hover { transform: translateY(-3px); filter: brightness(1.08); }
    .menu a:hover .go { transform: translateX(4px); opacity: 1; }
    .menu a:active { transform: scale(.97); filter: brightness(.95); }
    .menu a:focus-visible { outline: 3px solid var(--brand); outline-offset: 3px; }
    /* Partbook: warna berbeda (oranye) */
    .menu a.external {
        --brand: #d96a00; --btn-from: #f59a0b; --btn-to: #c2500a;
        --btn-shadow: 0 8px 20px rgba(217, 106, 0, .30), inset 0 1px 0 rgba(255,255,255,.25);
    }
    @media (prefers-color-scheme: dark) {
        .menu a.external {
            --brand: #ffa733; --btn-from: #c46a05; --btn-to: #7a3303;
            --btn-shadow: 0 8px 22px rgba(0, 0, 0, .55), 0 0 0 1px rgba(255,167,51,.25), 0 0 22px rgba(255,167,51,.12), inset 0 1px 0 rgba(255,255,255,.12);
        }
    }
    /* Danger Tag: warna merah seperti kartu Danger Tag */
    .menu a.danger {
        --brand: #dc1a22; --btn-from: #ea2a32; --btn-to: #a50f16;
        --btn-shadow: 0 8px 20px rgba(220, 26, 34, .30), inset 0 1px 0 rgba(255,255,255,.25);
    }
    .menu a.danger {
        background: linear-gradient(135deg, var(--btn-from), var(--btn-to));
    }
    /* Garis diagonal tipis & rapi, memudar halus ke arah kanan */
    .menu a.danger::after {
        content: ""; position: absolute; inset: 0; pointer-events: none; border-radius: inherit;
        background: repeating-linear-gradient(-45deg, transparent 0 9px, rgba(255,255,255,.22) 9px 15px);
        -webkit-mask-image: linear-gradient(90deg, #000 0%, rgba(0,0,0,.75) 25%, rgba(0,0,0,.3) 58%, transparent 88%);
                mask-image: linear-gradient(90deg, #000 0%, rgba(0,0,0,.75) 25%, rgba(0,0,0,.3) 58%, transparent 88%);
    }
    .menu a.danger > * { position: relative; z-index: 1; }
    .menu a.danger span { text-shadow: 0 1px 3px rgba(0,0,0,.4); }
    @media (prefers-color-scheme: dark) {
        .menu a.danger {
            --brand: #ff5a60; --btn-from: #c4161e; --btn-to: #6e0a10;
            --btn-shadow: 0 8px 22px rgba(0, 0, 0, .55), 0 0 0 1px rgba(255,90,96,.25), 0 0 22px rgba(255,90,96,.12), inset 0 1px 0 rgba(255,255,255,.12);
        }
    }
    /* CBM : Magnetic Plug: warna biru */
    .menu a.cbm {
        --brand: #0a6cc4; --btn-from: #1b8de6; --btn-to: #0b5aa8;
        --btn-shadow: 0 8px 20px rgba(10, 108, 196, .30), inset 0 1px 0 rgba(255,255,255,.25);
    }
    @media (prefers-color-scheme: dark) {
        .menu a.cbm {
            --brand: #5ab4ff; --btn-from: #0f6fc0; --btn-to: #07407a;
            --btn-shadow: 0 8px 22px rgba(0, 0, 0, .55), 0 0 0 1px rgba(90,180,255,.25), 0 0 22px rgba(90,180,255,.12), inset 0 1px 0 rgba(255,255,255,.12);
        }
    }
    .copyright {
        position: fixed; left: 0; right: 0; bottom: 0; text-align: center;
        padding: 12px 16px calc(12px + env(safe-area-inset-bottom, 0px));
        font-size: 11px; font-style: italic; color: var(--sub); background: var(--bg);
    }

    /* Loading overlay (sama seperti halaman index) */
    .loading {
        --l-bg: #ffffff; --l-text: #1e4620; --l-sub: #555; --l-track: #dfe5df; --l-bar: #218838;
        position: fixed; inset: 0; z-index: 100; display: none;
        align-items: center; justify-content: center;
        background: var(--l-bg); color: var(--l-text);
        padding: env(safe-area-inset-top, 0px) 16px env(safe-area-inset-bottom, 0px);
    }
    @media (prefers-color-scheme: dark) {
        .loading { --l-bg: #0e1113; --l-text: #7fd18a; --l-sub: #9aa3a8; --l-track: #263038; --l-bar: #4caf63; }
    }
    .loading.show { display: flex; }
    .loading .splash { text-align: center; width: 100%; max-width: 320px; animation: fadeIn .4s ease both; }
    .loading .splash img { height: 96px; width: auto; animation: pulse 1.6s ease-in-out infinite; }
    .loading .track { margin: 22px auto 0; width: 100%; height: 6px; border-radius: 3px; background: var(--l-track); overflow: hidden; }
    .loading .bar { height: 100%; width: 0; border-radius: 3px; background: var(--l-bar); }
    .loading.show .bar { animation: load 2s ease-in-out forwards; }
    .loading .status { margin-top: 12px; font-size: 14px; color: var(--l-sub); }
    .loading .l-copy {
        position: fixed; left: 0; right: 0; bottom: 0; text-align: center;
        padding: 12px 16px calc(12px + env(safe-area-inset-bottom, 0px));
        font-size: 11px; font-style: italic; color: var(--l-sub);
    }
    @keyframes load { from { width: 0; } to { width: 100%; } }
    @keyframes pulse { 0%, 100% { transform: scale(1); opacity: 1; } 50% { transform: scale(1.08); opacity: .8; } }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
    @media (prefers-reduced-motion: reduce) { .loading .splash img { animation: none; } }
</style>
</head>

<script>
    // Garis animasi: kilatan cahaya putih dengan arah, lebar, kecepatan, dan jeda acak
    (function () {
        const line = document.querySelector('.divider');
        if (!line || !line.animate || matchMedia('(prefers-reduced-motion: reduce)').matches) return;
        const rnd = (a, b) => a + Math.random() * (b - a);
        function spark() {
            const el = document.createElement('span');
            el.className = 'spark';
            const w = rnd(12, 40), rtl = Math.random() < 0.5;
            el.style.width = w + '%';
            line.appendChild(el);
            el.animate([
                { left: (rtl ? 100 : -w) + '%', opacity: 0 },
                { opacity: rnd(0.6, 1), offset: 0.5 },
                { left: (rtl ? -w : 100) + '%', opacity: 0 }
            ], { duration: rnd(700, 2200), easing: 'ease-in-out' }).onfinish = () => el.remove();
        }
        function loop() {
            spark();
            if (Math.random() < 0.3) setTimeout(spark, rnd(100, 500));
            setTimeout(loop, rnd(500, 2600));
        }
        setTimeout(loop, 1000);
    })();
    // Klik tombol -> tampilkan loading minimal 2 detik, lalu buka halaman tujuan
    const loading = document.getElementById('loading');
    document.getElementById('loadingLogo').src = document.querySelector('header img').src;
    document.querySelectorAll('.menu a').forEach(a => {
        a.addEventListener('click', e => {
            e.preventDefault();
            const target = a.getAttribute('href');
            const external = a.classList.contains('external');
            loading.classList.add('show');
            setTimeout(() => {
                if (external) {
                    // Partbook: buka di tab baru; jika diblokir browser, buka di tab ini
                    const w = window.open(target, '_blank', 'noopener');
                    if (w) { loading.classList.remove('show'); } else { location.href = target; }
                } else {
                    location.href = target;
                }
            }, 2000);
        });
    });
    // Jika kembali dari halaman lain (tombol Back), sembunyikan loading
    window.addEventListener('pageshow', () => loading.classList.remove('show'));
</script>
</body>
</html>
